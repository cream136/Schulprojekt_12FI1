<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stautracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Stautracker</h1>

    <label for="start">Start</label>
    <input id="start" type="text" placeholder="z. B. Würzburg Hauptbahnhof">

    <label for="ziel">Ziel</label>
    <input id="ziel" type="text" placeholder="z. B. Nürnberg Hauptbahnhof">

    <button id="suchen" type="button">Route suchen</button>

    <div id="ergebnis">Bitte Start und Ziel eingeben.</div>
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
